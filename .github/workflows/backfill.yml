name: backfill
on:
  workflow_dispatch:
    inputs:
      check_resolutions:
        description: "验证分辨率可用性（约 45 分钟）"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bing-wallpaper-deploy   # 与 daily.yml 共用，避免同时 push 冲突
  cancel-in-progress: false

jobs:
  backfill-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 历史回填（含 mkt 预检，预检不过的市场自动剔除）
        run: |
          FLAG=""
          if [ "${{ inputs.check_resolutions }}" != "true" ]; then FLAG="--skip-resolution-check"; fi
          python -m crawler.backfill --data-dir data $FLAG
      - name: 判断数据是否有变化
        id: diff
        run: |
          git add -A data/
          if git diff --cached --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 提交数据
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: backfill $(date -u +%F)"
          git pull --rebase origin main
          git push
      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: steps.diff.outputs.changed == 'true'
        working-directory: web
      - run: npm run build
        if: steps.diff.outputs.changed == 'true'
        working-directory: web
      - run: cp -r data/. web/dist/data/  # public/data（词典）先建了 dist/data，无 /. 会嵌套拷贝
        if: steps.diff.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true'
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.diff.outputs.changed == 'true'
