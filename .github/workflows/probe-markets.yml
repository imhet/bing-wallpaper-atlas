name: market-probe
on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测 ko-KR / zh-TW 各请求变体在 Actions 出口下的真实返回
        run: |
          for u in \
            "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=ko-KR" \
            "https://kr.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=ko-KR" \
            "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=ko-KR&cc=KR" \
            "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-TW" \
            "https://tw.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-TW" \
            "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-TW&cc=TW"; do
            echo "--- $u"
            curl -sS -m 15 "$u" | head -c 200; echo
          done
