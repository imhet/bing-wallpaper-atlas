name: daily-fetch
on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 北京时间次日 06:00
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "跳过数据变化检查，强制构建部署（用于纯前端改动上线）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bing-wallpaper-deploy
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 打标依赖（torch CPU 轮 + open_clip）与常规依赖分离——PyPI 默认 linux torch 带 CUDA ~2GB
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install open_clip_torch pillow transformers
      - name: 每日增量抓取（核心市场失败则红灯）
        run: python -m crawler.fetch_daily
      - name: 新图内容打标（VLM 优先降级 CLIP，模型不可用时降级不阻塞——次日重试会补上）
        run: python -m crawler.content_tags --data-dir data
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      - name: 深史缩略图缓存（深史已封顶不再增长，key 固定即命中后永不重生成；被 GitHub 清理也只是下次部署重新生成）
        uses: actions/cache@v4
        with:
          path: data/thumbs
          key: thumbs-v2
      - name: 生成深史缩略图（仅缓存 miss 时真正下载镜像原图并转 480 宽 WebP；不阻塞部署）
        run: python -m crawler.gen_thumbs --data-dir data
        continue-on-error: true
      # 打标重试：首次打标在 00:25 左右，扩展市场缩略图生成约 5 分钟，此时间隔足够避开限流窗口；
      # 增量语义只补 content_tags 为 None 的图组，成功过的组不会重打
      - name: 内容打标补跑（首次遇到 429 的图组在此重试）
        run: python -m crawler.content_tags --data-dir data
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      # 语义索引增量：已编码的图组直接复用，只给新图跑编码；模型走 cache，命中后只加载不下载
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chinese-clip-v1
      - name: 语义向量增量（新图编码；失败不阻塞部署，前端自动退回关键词检索）
        run: python -m crawler.semantic_index --data-dir data --out-dir data/sem
        continue-on-error: true
      - name: 判断数据是否有变化（先暂存再看 diff——git diff 看不见未跟踪的新文件，年切换日靠它兜底）
        id: diff
        run: |
          git add -A data/
          if git diff --cached --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 提交数据
        if: steps.diff.outputs.changed == 'true'
        # 这一步排在 build/deploy 之前，一旦失败就把上线一起卡死：部署遇 Pages 500 后 rerun，
        # 上一次已推的 bot 提交会让 git pull --rebase 撞车，线上于是永远停在旧版本。
        # 数据入 git 失败只该影响记账，不该影响上线；但必须先清掉 rebase 残留——
        # 停在冲突态时 data/ 里的冲突标记会跟着拷进 dist，发出一个 JSON 全坏的站点。
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: daily wallpaper update $(date -u +%F)"
          if ! git pull --rebase origin main; then
            echo "::warning::数据提交冲突，放弃本次提交，改用远程数据部署"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard FETCH_HEAD
            exit 0
          fi
          git push || echo "::warning::push 失败，本次数据已生成但未入库"
      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'true' || inputs.force_deploy == true
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: steps.diff.outputs.changed == 'true' || inputs.force_deploy == true
        working-directory: web
      - run: npm run build
        if: steps.diff.outputs.changed == 'true' || inputs.force_deploy == true
        working-directory: web
      - run: cp -r data/. web/dist/data/  # public/data（词典）先建了 dist/data，无 /. 会嵌套拷贝
        if: steps.diff.outputs.changed == 'true' || inputs.force_deploy == true
      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true' || inputs.force_deploy == true
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.diff.outputs.changed == 'true' || inputs.force_deploy == true
